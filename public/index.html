<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Management Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }
        .card { border: none; border-radius: 10px; }
        .table { background-color: white; border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">🎓 StudentHub</a>
        </div>
    </nav>

    <div class="container">
        <!-- Add Student Form -->
        <div class="card p-4 mb-4 shadow-sm">
            <h5 class="mb-3 text-secondary">Register New Student</h5>
            <form id="studentForm" class="row g-3">
                <div class="col-md-3">
                    <input type="text" id="name" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="col-md-3">
                    <input type="email" id="email" class="form-control" placeholder="Email Address" required>
                </div>
                <div class="col-md-3">
                    <input type="text" id="course" class="form-control" placeholder="Course Name" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Add Student</button>
                </div>
            </form>
        </div>

        <!-- Students Table -->
        <div class="shadow-sm rounded">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Fetch and load students
        async function loadStudents() {
            try {
                const res = await fetch('/api/students');
                const students = await res.json();
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                
                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">No students found. Add one above!</td></tr>';
                    return;
                }

                students.forEach(student => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="align-middle fw-bold text-secondary">#${student.id}</td>
                            <td class="align-middle">${student.name}</td>
                            <td class="align-middle">${student.email}</td>
                            <td class="align-middle"><span class="badge bg-info text-dark">${student.course}</span></td>
                            <td class="text-center align-middle">
                                <button class="btn btn-outline-danger btn-sm" onclick="deleteStudent(${student.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error loading students:", error);
            }
        }

        // Add new student
        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page reload
            
            const newStudent = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                course: document.getElementById('course').value
            };

            try {
                await fetch('/api/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newStudent)
                });

                document.getElementById('studentForm').reset(); // Clear form
                loadStudents(); // Refresh table
            } catch (error) {
                console.error("Error adding student:", error);
            }
        });

        // Delete student
        async function deleteStudent(id) {
            try {
                await fetch(`/api/students/${id}`, { method: 'DELETE' });
                loadStudents(); // Refresh table
            } catch (error) {
                console.error("Error deleting student:", error);
            }
        }

        // Load data when page starts
        loadStudents();
    </script>
</body>
</html>
